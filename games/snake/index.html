<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snake X Ultra</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#fff;font-family:system-ui,Arial;touch-action:none}body{display:flex;align-items:center;justify-content:center}#app{width:min(1180px,100vw);height:min(920px,100vh);padding:10px;display:grid;grid-template-rows:auto 1fr;gap:8px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900}.brand span{background:linear-gradient(90deg,#62ff8c,#52d9ff);color:transparent;background-clip:text;-webkit-background-clip:text}.stats{display:flex;gap:6px;flex:1;justify-content:center}.stat,.btn{background:#0d1420df;border:1px solid #ffffff18;border-radius:12px}.stat{min-width:70px;padding:6px 10px;text-align:center}.stat small{display:block;color:#9eabba;font-size:10px}.stat b{font-size:17px}.btn{color:#fff;padding:8px 11px;cursor:pointer}main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:8px;min-height:0}.board{position:relative;min-height:0;border:1px solid #ffffff18;border-radius:22px;padding:6px;background:#080d14;box-shadow:0 25px 80px #0009;overflow:hidden}canvas{width:100%;height:100%;display:block;border-radius:17px}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.pill{font-size:12px;background:#070b12aa;border:1px solid #ffffff18;padding:6px 10px;border-radius:999px}.side{background:#0d1420df;border:1px solid #ffffff18;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}.side h3{font-size:14px;margin:0}.mission,.power button,.modes button{border:1px solid #ffffff15;background:#ffffff07;border-radius:11px;color:#fff}.mission{padding:9px}.row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.bar{height:7px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#62ff8c,#52d9ff)}.power{display:grid;grid-template-columns:1fr 1fr;gap:6px}.power button,.modes button{padding:9px 4px;cursor:pointer}.modes{display:grid;gap:6px}.modes .active{outline:2px solid #62ff8c55}.help{margin-top:auto;color:#8d9aab;font-size:11px;line-height:1.7}.controls{display:none;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin-top:7px}.controls button{height:52px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff12;color:#fff;font-size:21px}.blank{visibility:hidden}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}.card{width:min(92vw,440px);background:#0d1420;border:1px solid #ffffff20;border-radius:24px;padding:28px;text-align:center}.card h1{margin:0 0 8px}.card p{color:#c1cad5;line-height:1.9}.primary{border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(90deg,#62ff8c,#52d9ff);font-weight:900;cursor:pointer}.hidden{display:none}#toast{position:fixed;z-index:30;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#111b29ee;border:1px solid #ffffff22;border-radius:999px;padding:9px 16px;transition:.2s}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){#app{height:100dvh;padding:7px;gap:6px}main{display:block}.side{display:none}.board{height:calc(100dvh - 128px)}.controls{display:grid}.brand{font-size:22px}.stats{width:100%;order:3}.stat{flex:1;min-width:0;padding:5px}.stat b{font-size:14px}}
</style></head><body><div id="app"><header><div class="brand">🐍 <span>SNAKE X ULTRA</span></div><div class="stats"><div class="stat"><small>امتیاز</small><b id="score">0</b></div><div class="stat"><small>رکورد</small><b id="best">0</b></div><div class="stat"><small>مرحله</small><b id="level">1</b></div><div class="stat"><small>سکه</small><b id="coins">0</b></div></div><div><button class="btn" id="pause">⏸</button><button class="btn" id="sound">🔊</button></div></header><main><section class="board" id="board"><canvas id="game"></canvas><div class="hud"><span class="pill" id="status">GO!</span><span class="pill" id="combo">Combo ×1</span></div><div class="controls"><button class="blank"></button><button data-dir="up">▲</button><button class="blank"></button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></section><aside class="side"><h3>🎯 مأموریت</h3><div class="mission"><div class="row"><span>۱۰۰ امتیاز</span><b id="missionText">0/100</b></div><div class="bar"><i id="missionBar"></i></div></div><h3>⚡ قدرت‌ها</h3><div class="power"><button id="boost">🚀 سرعت<br><small>۴ ثانیه</small></button><button id="shield">🛡 سپر<br><small>یک برخورد</small></button><button id="magnet">🧲 آهنربا<br><small>۶ ثانیه</small></button><button id="freeze">❄️ فریز<br><small>۳ ثانیه</small></button></div><h3>🎮 حالت</h3><div class="modes"><button class="active" data-mode="classic">کلاسیک</button><button data-mode="portal">پورتال</button><button data-mode="maze">هزارتو</button><button data-mode="rush">حمله سرعتی</button></div><div class="help">کامپیوتر: WASD یا جهت‌ها<br>P یا Space: توقف<br>موبایل: دکمه‌ها یا کشیدن انگشت</div></aside></main></div><div class="overlay hidden" id="overlay"><div class="card"><h1 id="ot">💥 بازی تمام شد</h1><p id="ox"></p><button class="primary" id="restart">🔄 دوباره بازی کن</button></div></div><div id="toast"></div>
<script>
"use strict";
const C=document.getElementById('game'),ctx=C.getContext('2d'),$=id=>document.getElementById(id),N=24;
let W=300,H=300,cell=12,snake=[],food=null,coins=[],obs=[],dir={x:1,y:0},next={x:1,y:0},score=0,coinCount=0,level=1,combo=1,comboT=0,best=+(localStorage.getItem('snakeXUltraBest')||0),mode='classic',running=false,paused=false,shield=false,boost=0,freeze=0,magnet=0,last=0,acc=0,parts=[],sound=true,audio=null,touch=null;
$('best').textContent=best;
function resize(){const r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;C.width=Math.max(1,Math.floor(W*d));C.height=Math.max(1,Math.floor(H*d));ctx.setTransform(d,0,0,d,0,0);cell=Math.min(W,H)/N;draw()}addEventListener('resize',resize);
function occ(x,y){return snake.some(s=>s.x===x&&s.y===y)||obs.some(o=>o.x===x&&o.y===y)||coins.some(c=>c.x===x&&c.y===y)||(food&&food.x===x&&food.y===y)}
function free(){for(let i=0;i<800;i++){let p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};if(!occ(p.x,p.y))return p}return{x:N-2,y:N-2}}
function start(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12},{x:8,y:12}];dir={x:1,y:0};next={x:1,y:0};score=coinCount=0;level=1;combo=1;comboT=0;coins=[];obs=[];shield=false;boost=freeze=magnet=0;parts=[];running=true;paused=false;acc=0;last=performance.now();if(mode==='maze'){for(let i=0;i<38;i++){let p={x:2+(Math.random()*(N-4)|0),y:2+(Math.random()*(N-4)|0)};if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&!obs.some(o=>o.x===p.x&&o.y===p.y))obs.push(p)}}food=free();$('overlay').classList.add('hidden');$('pause').textContent='⏸';$('status').textContent='GO!';ui();requestAnimationFrame(loop)}
function setDir(k){let m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[k];if(!m|| (m[0]===-dir.x&&m[1]===-dir.y))return;next={x:m[0],y:m[1]}}
function stepMs(){let base=mode==='rush'?Math.max(34,82-level*2):Math.max(48,128-level*5);if(performance.now()<boost)base*=.55;if(performance.now()<freeze)base*=3.5;return base}
function tick(){if(!running||paused)return;dir=next;let nx=snake[0].x+dir.x,ny=snake[0].y+dir.y;if(mode==='portal'){nx=(nx+N)%N;ny=(ny+N)%N}else if(nx<0||ny<0||nx>=N||ny>=N){if(!hitShield())return;nx=snake[0].x;ny=snake[0].y}if(obs.some(o=>o.x===nx&&o.y===ny)||snake.some((s,i)=>i&&s.x===nx&&s.y===ny)){if(!hitShield())return;nx=snake[0].x;ny=snake[0].y}snake.unshift({x:nx,y:ny});let ate=food&&nx===food.x&&ny===food.y;if(ate){score+=10*combo;combo=Math.min(9,combo+1);comboT=180;partsAdd(nx,ny,'#62ff8c');food=free();beep(560,.06);if(Math.random()<.55)coins.push(free());if(score>=level*50){level++;toast('🔥 مرحله '+level+'!');beep(780,.1)}}else snake.pop();if(performance.now()<magnet&&coins.length){let t=coins.reduce((a,b)=>Math.abs(a.x-nx)+Math.abs(a.y-ny)<Math.abs(b.x-nx)+Math.abs(b.y-ny)?a:b);if(Math.abs(t.x-nx)+Math.abs(t.y-ny)<=6){t.x=nx;t.y=ny}}let ci=coins.findIndex(c=>c.x===nx&&c.y===ny);if(ci>=0){coins.splice(ci,1);coinCount++;score+=5;partsAdd(nx,ny,'#ffd45a');beep(820,.05)}if(comboT>0&&!--comboT)combo=1;ui()}
function hitShield(){if(!shield){gameOver();return false}shield=false;toast('🛡 سپر نجاتت داد!');beep(230,.1);return true}
function loop(t){if(!running)return;let dt=Math.min(60,t-last);last=t;if(!paused){acc+=dt;let ms=stepMs();while(acc>=ms&&running){acc-=ms;tick()}}draw();requestAnimationFrame(loop)}
function gameOver(){running=false;best=Math.max(best,score);localStorage.setItem('snakeXUltraBest',best);$('best').textContent=best;$('ot').textContent='💥 بازی تمام شد';$('ox').innerHTML='امتیاز: <b>'+score+'</b><br>سکه: <b>'+coinCount+'</b><br>رکورد: <b>'+best+'</b>';$('status').textContent='پایان';$('overlay').classList.remove('hidden');beep(140,.2)}
function ui(){$('score').textContent=score;$('best').textContent=best;$('level').textContent=level;$('coins').textContent=coinCount;$('missionText').textContent=Math.min(100,score)+'/100';$('missionBar').style.width=Math.min(100,score)+'%';$('combo').textContent='Combo ×'+combo}
function partsAdd(gx,gy,col){for(let i=0;i<16;i++)parts.push({x:(gx+.5)*cell,y:(gy+.5)*cell,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,l:1,c:col})}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));g.addColorStop(0,'#102426');g.addColorStop(1,'#04080d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<55;i++){let px=(i*83)%W,py=(i*47)%H;ctx.beginPath();ctx.arc(px,py,1,0,7);ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.035)';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,N*cell);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(N*cell,i*cell);ctx.stroke()}obs.forEach(o=>{ctx.fillStyle='#795cff66';ctx.fillRect(o.x*cell+2,o.y*cell+2,cell-4,cell-4)});if(food){ctx.save();ctx.fillStyle='#ff6477';ctx.shadowBlur=18;ctx.shadowColor='#ff6477';ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.28,0,7);ctx.fill();ctx.restore()}coins.forEach(c=>{ctx.save();ctx.strokeStyle='#ffd45a';ctx.lineWidth=3;ctx.beginPath();ctx.arc((c.x+.5)*cell,(c.y+.5)*cell,cell*.22,0,7);ctx.stroke();ctx.restore()});snake.forEach((s,i)=>{let p=i?3:2;ctx.save();ctx.fillStyle=i?'#42da7d':'#a3ff77';ctx.shadowBlur=i?5:15;ctx.shadowColor='#59ff9b';ctx.beginPath();ctx.roundRect(s.x*cell+p,s.y*cell+p,cell-p*2,cell-p*2,cell*.22);ctx.fill();ctx.restore()});if(snake[0]){let h=snake[0],cx=(h.x+.5)*cell,cy=(h.y+.5)*cell,ex=cx+dir.x*cell*.17,ey=cy+dir.y*cell*.17,r=Math.max(2.2,cell*.055);ctx.fillStyle='#082016';ctx.beginPath();ctx.arc(ex-dir.y*cell*.1,ey+dir.x*cell*.1,r,0,7);ctx.fill();ctx.beginPath();ctx.arc(ex+dir.y*cell*.1,ey-dir.x*cell*.1,r,0,7);ctx.fill()}for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l-=.04;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0)}
function toast(t){let z=$('toast');z.textContent=t;z.classList.add('show');clearTimeout(z.t);z.t=setTimeout(()=>z.classList.remove('show'),1400)}
function beep(f,d){if(!sound)return;try{audio||(audio=new(window.AudioContext||window.webkitAudioContext)());if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function power(p){if(!running)return;let n=performance.now();if(p==='boost')boost=n+4000;if(p==='shield')shield=true;if(p==='magnet')magnet=n+6000;if(p==='freeze')freeze=n+3000;toast({boost:'🚀 سرعت فعال شد',shield:'🛡 سپر فعال شد',magnet:'🧲 آهنربا فعال شد',freeze:'❄️ فریز فعال شد'}[p])}
function togglePause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';$('status').textContent=paused?'توقف':'در حال بازی'}
document.addEventListener('keydown',e=>{let m={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[e.key.toLowerCase()];if(m){e.preventDefault();setDir(m)}else if(e.key===' '||e.key.toLowerCase()==='p'){e.preventDefault();togglePause()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDir(b.dataset.dir)}));$('pause').onclick=togglePause;$('restart').onclick=start;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};['boost','shield','magnet','freeze'].forEach(p=>$(p).onclick=()=>power(p));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(q=>q.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;start()});
$('board').addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touch={x:e.clientX,y:e.clientY}});$('board').addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')});
resize();start();
</script></body></html>
